<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Bridge Walker – Controller</title>
    <link rel="stylesheet" href="/src/phone/phone.css" />
  </head>
  <body>
    <section id="screen-connect" class="screen">
      <h1>Bridge Walker</h1>
      <p id="room-label"></p>
      <button id="btn-connect" class="big">Connect</button>
      <p id="connect-error" class="error"></p>
    </section>

    <section id="screen-calibrate" class="screen" hidden>
      <p id="calib-text"></p>
      <button id="btn-calib" class="big"></button>
    </section>

    <section id="screen-play" class="screen play" hidden>
      <div class="pad pad-left">
        <button id="btn-walk" class="ctl walk" type="button" aria-label="Walk. Press and hold to walk.">WALK</button>
        <button id="btn-run" class="ctl run" type="button" aria-label="Run. Press and hold to run fast.">RUN</button>
        <button id="btn-gust-left" class="ctl gust" type="button" aria-label="Gust to the left. Pushes the walker to the left." hidden><span class="gust-label">← GUST</span></button>
      </div>
      <div class="centre">
        <div class="statusrow">
          <span id="badge" class="badge p1" aria-label="You are player 1">P1</span>
          <p id="status" role="status">Connected</p>
        </div>
        <div class="meter-row">
          <span id="wind-left" class="wind-chip" hidden aria-hidden="true"><svg viewBox="0 0 120 48"><path d="M4 17h68V3l44 21-44 21V31H4z" /></svg></span>
          <div class="meter" role="img" aria-label="Balance meter. Tilt the phone to stay in the green."><div id="meter-needle"></div></div>
          <span id="wind-right" class="wind-chip" hidden aria-hidden="true"><svg viewBox="0 0 120 48"><path d="M116 17H48V3L4 24l44 21V31h68z" /></svg></span>
        </div>
        <p id="wind-text" class="wind-text" role="status" aria-live="polite"></p>
        <div id="gust-cool" class="gust-cool ready" hidden>
          <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15" /><circle class="arc" cx="18" cy="18" r="15" /></svg>
          <span id="gust-state">GUST READY</span>
        </div>
        <div id="modes" class="modes" role="group" aria-label="Game mode" hidden>
          <button type="button" class="mode" data-mode="solo" aria-pressed="true">Solo</button>
          <button type="button" class="mode" data-mode="race" aria-pressed="false">Race</button>
          <button type="button" class="mode" data-mode="windmaster" aria-pressed="false">Wind Master</button>
        </div>
        <button id="btn-start" class="big" type="button">Start</button>
        <div class="row">
          <button id="btn-pause" class="view" type="button" hidden>⏸ Pause</button>
          <button id="btn-camera" class="view" type="button" aria-label="Change camera view: chase, first person, cinematic.">🎥 VIEW</button>
          <button id="btn-sound" class="view" type="button" aria-expanded="false" aria-controls="sound-sheet">🔊 Sound</button>
        </div>
        <div id="sound-sheet" class="sheet" role="group" aria-label="Sound" hidden>
          <label>Music <input id="vol-music" type="range" min="0" max="100" step="5" /></label>
          <label>Effects <input id="vol-sfx" type="range" min="0" max="100" step="5" /></label>
          <button id="btn-sound-done" class="big" type="button">Done</button>
        </div>
        <button id="btn-recalibrate" class="link" type="button">Recalibrate</button>
      </div>
      <div class="pad pad-right">
        <button id="btn-jump" class="ctl jump" type="button" aria-label="Jump. Tap to jump over a gap.">JUMP</button>
        <button id="btn-gust-right" class="ctl gust" type="button" aria-label="Gust to the right. Pushes the walker to the right." hidden><span class="gust-label">GUST →</span></button>
      </div>
    </section>

    <script type="module" src="/src/phone/main.js"></script>
  </body>
</html>
